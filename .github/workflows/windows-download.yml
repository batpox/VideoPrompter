name: Windows Download

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows application
        shell: pwsh
        run: dotnet publish source/VideoPrompter/VideoPrompter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Include Windows launcher and instructions
        shell: pwsh
        run: |
          Copy-Item packaging/Start-VideoPrompter.cmd publish/
          Copy-Item packaging/README-Windows.txt publish/
      - name: Package download
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath VideoPrompter-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPrompter-Windows-x64
          path: VideoPrompter-Windows-x64.zip
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" VideoPrompter-Windows-x64.zip --generate-notes --title "VideoPrompter ${{ github.ref_name }}"
